[package]
name = "wind-desktop"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Banc de demarrage (exploration 2026-08-26). N'existe que pour MESURER la
# tranche WebView2 : `tauri/tracing` allume les `debug_span!` deja ecrits en
# amont — `wry::webview::create`, `wry::window::create`, `wry::window::draw`
# (tauri-runtime-wry/src/lib.rs:4510-4515) — plus les `info_span!` de wry sur
# l'IPC et le service des assets. Aucune ligne de mesure a ecrire ici.
#
# JAMAIS dans le binaire livre : `faire-release.ps1` ne passe pas la feature,
# et `main.rs` ne rend la console QUE sous elle (un binaire `windows_subsystem`
# n'a pas de stderr ou ecrire les spans).
[features]
mesure = ["tauri/tracing", "dep:tracing-subscriber", "dep:tracing"]

[dependencies]
# Horodatage ISO 8601 des rapports de plantage (telemetrie, ADR 0014).
chrono.workspace = true
mail-auth.workspace = true
mail-core.workspace = true
mail-ical.workspace = true
mail-imap.workspace = true
mail-render.workspace = true
mail-smtp.workspace = true
serde.workspace = true
# Exige par la macro `generate_context!` des que la config porte le
# plugin updater (ADR 0013) : elle deserialise les endpoints et la cle.
serde_json.workspace = true
tauri = { version = "2", features = [] }
# Notifications systeme : appelees depuis RUST, pas depuis le JS — les
# capabilities de la fenetre restent au minimum (moindre privilege).
tauri-plugin-notification = "2"
# Mise a jour automatique signee (ADR 0013). Pilotee depuis RUST, meme
# raison que les notifications : la webview n'appelle jamais l'API
# updater, seulement nos commandes — capabilities au strict minimum.
# EPINGLE (PLAN-SIGNATURE E4) : update_install s'appuie sur des faits
# internes de 2.10.1 (minisign verifiee DANS download(), artefact = exe
# NSIS nu, arguments /P /R /UPDATE du mode passif). Un bump est un acte
# conscient : relire update_install (commands.rs) avant de bouger.
tauri-plugin-updater = "=2.10.1"
# Selecteur de fichiers natif du composeur (PLAN-PIECES-JOINTES, PJ-D5).
# Seule exception au « pilote depuis Rust » : la boite de dialogue est
# un geste de la webview — capability limitee a dialog:allow-open.
tauri-plugin-dialog = "2"
# Espace disque disponible (garde de l'ADR 0010 §4). Dans l'app et non
# dans mail-core : interroger le systeme de fichiers est de l'I/O de
# plateforme, la DECISION (disk_shortfall) reste pure dans le coeur.
fs4 = "0.13"
# Boite de dialogue AVANT toute fenetre Tauri (mono-instance E1, echec du
# demenagement) : rfd est ce que tauri-plugin-dialog utilise deja — aucune
# compilation ni feature de plus, et pas de dependance windows-sys directe.
rfd = { version = "0.16", default-features = false }
# Liens du corps vers le navigateur SYSTEME (open_link) : ShellExecuteW
# bien emballe, la ou `explorer` (patron de telemetry_open_folder) est
# fait pour des dossiers, pas des URL. Le schema est valide en Rust
# AVANT l'appel — la garde vit ici, pas dans l'UI.
# `shellexecute-on-windows` n'est PAS decoratif (audit 2026-09-01) : sans
# la feature, `open::that_detached` lance `powershell.exe Start-Process`
# par un CreateProcess SYNCHRONE — sur le thread principal, puisque
# `open_link` est exemptee de la garde (PLAN-GELS). Avec, c'est
# ShellExecuteW, l'appel detache que le commentaire promettait.
open = { version = "5", features = ["shellexecute-on-windows"] }
# Banc de demarrage seulement (feature `mesure`) : le collecteur qui imprime
# la duree des spans d'amont a leur fermeture.
tracing-subscriber = { version = "0.3", optional = true }
# Idem : nos PROPRES jalons, la ou les spans d'amont ne disent rien — le
# detail d'une commande dont on cherche a savoir ce qu'elle paie.
tracing = { version = "0.1", optional = true }

[lints]
workspace = true
