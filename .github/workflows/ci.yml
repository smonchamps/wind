name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + tests (Windows leg — the support matrix lists all four triples)
    runs-on: windows-latest
    steps:
      # v5 runs on Node 24; v4 (Node 20) is deprecated by GitHub.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PINNED version (mirror of rust-toolchain.toml, which this action
      # does not read). The CI no longer follows "the latest stable": a
      # new clippy lint of a future Rust version can no longer break the
      # build without our decision. Bumping = change here AND in
      # rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # B1: the shipped config points at ui-v2/dist — `generate_context!`
      # requires the folder to EXIST at compile time. The Vite build
      # therefore precedes any cargo that compiles the desktop.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui-v2/package-lock.json
      - name: Build ui-v2 (required by generate_context)
        run: npm ci && npm run build
        working-directory: apps/desktop/ui-v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lints (warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # --all-targets is NOT decorative: without it, cargo ignores the tests
      # of the EXAMPLES (crates/mail-core/examples/) — including the one
      # that keeps a diagnostic from disclosing credentials. The pre-push
      # hook knew it, the CI did not (audit 2026-09-01). Same scope as
      # gate.ps1.
      - name: Tests (--all-targets)
        run: cargo test --workspace --all-targets
      - name: Tests (--doc)
        run: cargo test --workspace --doc

  # No E2E job here: a hosted GitHub runner does not open a WebView2
  # window (measured — see ADR 0005). The E2E journeys are played by the
  # `.githooks/pre-push` hook, on a real Windows session.

  # PLAN-MACOS D6 (Chief Engineer, 2026-09-04): the macOS compile-and-unit net —
  # without it, a mac-breaking change is invisible from the Windows
  # workstation until someone builds on the MacBook Air. No fmt (the
  # Windows job holds it, one copy) and no e2e (WKWebView exposes no
  # CDP — D5: the mac gate is THIS job plus the field pass).
  # NB: `macos-latest` is an Apple Silicon runner. Two product triples
  # ship (PLAN-APPLE-SILICON D2, 2026-09-05): x86_64-apple-darwin, whose
  # test binaries run under Rosetta 2 on this runner, and
  # aarch64-apple-darwin, the runner's own arch -- a native runtime
  # pass. Every cargo step names `--target` from the matrix, so each
  # job proves a triple that SHIPS (review 2026-09-04). Pinned versions
  # mirror the `quality` job: a toolchain or action bump changes ALL
  # jobs and rust-toolchain.toml.
  quality-macos:
    name: clippy + tests (macOS ${{ matrix.triple }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        triple: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One cache per triple: the default key is the job id, which
          # both matrix legs share -- they would overwrite each other's
          # target/ at every run.
          key: ${{ matrix.triple }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui-v2/package-lock.json
      - name: Build ui-v2 (required by generate_context)
        run: npm ci && npm run build
        working-directory: apps/desktop/ui-v2
      - name: Lints (warnings = errors)
        run: cargo clippy --workspace --all-targets --target ${{ matrix.triple }} -- -D warnings
      - name: Tests (--all-targets)
        run: cargo test --workspace --all-targets --target ${{ matrix.triple }}
      - name: Tests (--doc)
        run: cargo test --workspace --doc --target ${{ matrix.triple }}

  # PLAN-AUDIT-2026-09 Lot 5 E15e (audit G06): Windows arm64 SHIPS
  # (make-release.ps1 builds it from the release commit) but no hosted
  # runner is arm64 — this job is the proof a hosted runner can give:
  # the whole workspace type-checks and lints for the shipped triple
  # (build scripts, cfg gates, windows-sys bindings). Tests run on x64
  # (the `quality` job); the native run proof stays the field, on the
  # Chief Engineer's arm64 workstation (STANDARD §2.10).
  quality-windows-arm64:
    name: clippy (Windows aarch64-pc-windows-msvc, cross-check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: aarch64-pc-windows-msvc
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui-v2/package-lock.json
      - name: Build ui-v2 (required by generate_context)
        run: npm ci && npm run build
        working-directory: apps/desktop/ui-v2
      - name: Lints for the arm64 triple (warnings = errors)
        run: cargo clippy --workspace --all-targets --target aarch64-pc-windows-msvc -- -D warnings

  ui-v2:
    name: build ui-v2 (Svelte + Vite, PLAN-UI-V2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui-v2/package-lock.json
      - name: Dependencies
        run: npm ci
        working-directory: apps/desktop/ui-v2
      - name: Vite build
        run: npm run build
        working-directory: apps/desktop/ui-v2
      # Audit lot 4 (E11b, S03): a new advisory at moderate or above blocks
      # (Chief Engineer decision D3, 2026-09-07). The baseline is zero
      # after the Vite 7 upgrade; a false positive becomes a job, never a
      # `--force` fix.
      - name: npm audit (ui-v2)
        run: npm audit --audit-level=moderate
        working-directory: apps/desktop/ui-v2
      - name: npm audit (e2e)
        run: npm ci --ignore-scripts && npm audit --audit-level=moderate
        working-directory: e2e
      # The release poka-yoke, proven on every push and not on release day
      # (E11b / D-52 item 8): a dist built without the e2e flag carries no
      # seam.
      - name: Release dist carries no e2e seam
        run: node scripts/build-dist-clean.mjs
      - name: WCAG contrasts (A8)
        run: node e2e/contrast.mjs
      - name: System coherence (DC-D6)
        run: node e2e/system-coherence.mjs
      - name: Main-thread guard (PLAN-GELS)
        run: node e2e/main-thread-guard.mjs
      # PLAN-ENGLISH-SWITCH E1: the four nets of the switch, same scripts
      # as gate.ps1 (steps 2 and 7-9).
      - name: Lint ui-v2 (eslint no-undef)
        run: npm run lint
        working-directory: apps/desktop/ui-v2
      - name: Language ratchet
        run: node e2e/language-gate.mjs
      - name: IPC contract (Tauri commands)
        run: node e2e/ipc-contract.mjs
      - name: Markdown links
        run: node e2e/docs-links.mjs

  # Audit lot 4 (E11b, A10): the standalone Node suites -- the gate's step
  # 13 without Playwright -- on the platform the gate proves. They need no
  # WebView2: consent controller, launcher, catalogs, DOM contract, the
  # release chain's decisions and its PowerShell guards against fake tools.
  node-tests:
    name: Node suites (release chain, catalogs, launcher)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Dependencies (e2e, no browsers)
        run: npm ci --ignore-scripts
        working-directory: e2e
      - name: Node suites (the gate's list, e2e/package.json test:node)
        run: npm run test:node
        working-directory: e2e

  audit:
    name: cargo audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      # v5 runs on Node 24; v4 (Node 20) is deprecated by GitHub.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `cargo audit` directly, not the rustsec/audit-check action: that
      # one only exists for Node 20 (no Node 24 version published), so
      # GitHub would force it onto Node 24 with a deprecation warning.
      # dtolnay (composite action) and rust-cache (Node 24) do not have
      # that problem. Same guard as before: `cargo audit` exits non-zero
      # on a vulnerability and fails the job.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit (dependency CVEs)
        run: cargo audit
