name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + tests (Windows, cible du produit)
    runs-on: windows-latest
    steps:
      # v5 tourne sur Node 24 ; v4 (Node 20) est deprecie par GitHub.
      - uses: actions/checkout@v5
      # Version EPINGLEE (miroir de rust-toolchain.toml, que cette action
      # ne lit pas). La CI ne suit plus « le dernier stable » : un lint
      # clippy neuf d'une future version de Rust ne peut plus casser le
      # build sans qu'on l'ait decide. Monter de version = changer ici ET
      # dans rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # B1 : la conf expédiée pointe sur ui-v2/dist — `generate_context!`
      # exige que le dossier EXISTE à la compilation. Le build Vite
      # précède donc tout cargo qui compile le desktop.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui-v2/package-lock.json
      - name: Build ui-v2 (requis par generate_context)
        run: npm ci && npm run build
        working-directory: apps/desktop/ui-v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lints (warnings = erreurs)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Pas de job E2E ici : un runner GitHub hébergé n'ouvre pas de fenêtre
  # WebView2 (mesuré — voir ADR 0005). Les parcours E2E sont joués par le
  # hook `.githooks/pre-push`, sur une vraie session Windows.

  ui-v2:
    name: build ui-v2 (Svelte + Vite, PLAN-UI-V2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui-v2/package-lock.json
      - name: Dependances
        run: npm ci
        working-directory: apps/desktop/ui-v2
      - name: Build Vite
        run: npm run build
        working-directory: apps/desktop/ui-v2
      - name: Contrastes WCAG (A8)
        run: node e2e/contraste.mjs
      - name: Coherence du Systeme (DC-D6)
        run: node e2e/coherence-systeme.mjs
      - name: Garde du thread principal (PLAN-GELS)
        run: node e2e/garde-thread-principal.mjs

  audit:
    name: cargo audit (CVE des dépendances)
    runs-on: ubuntu-latest
    steps:
      # v5 tourne sur Node 24 ; v4 (Node 20) est deprecie par GitHub.
      - uses: actions/checkout@v5
      # `cargo audit` en direct, et non l'action rustsec/audit-check :
      # celle-ci n'existe qu'en Node 20 (aucune version Node 24 publiee),
      # donc GitHub la forcerait sur Node 24 avec un warning de
      # depreciation. dtolnay (action composite) et rust-cache (Node 24)
      # n'ont pas ce probleme. Meme garde qu'avant : `cargo audit` sort
      # non-zero sur une vulnerabilite et fait echouer le job.
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Installer cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit (CVE des dépendances)
        run: cargo audit
