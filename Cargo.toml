[workspace]
resolver = "2"
members = [
    "crates/mail-core",
    "crates/mail-imap",
    "crates/mail-auth",
    "crates/mail-ical",
    "crates/mail-render",
    "crates/mail-smtp",
    "apps/desktop",
]
# Aucun spike ici (audit 2026-09-01) : `spikes/web-bridge` etait membre
# et se faisait compiler, linter, tester et auditer a chaque gate et
# chaque run CI depuis le 2026-07-12, pour rien — seule raison de
# compiler tiny_http et une seconde rusqlite bundled. Chaque spike porte
# son propre `[workspace]`, comme spikes/idle.

[workspace.package]
# La version produit (celle de tauri.conf.json) — bumpee par
# scripts/make-release.ps1 a chaque release (PLAN-RETOURS-12 R4, D3) :
# les crates internes disent la version de l'app qui les embarque.
version = "0.17.0"
edition = "2024"

[workspace.dependencies]
mail-auth = { path = "crates/mail-auth" }
mail-core = { path = "crates/mail-core" }
mail-ical = { path = "crates/mail-ical" }
mail-imap = { path = "crates/mail-imap" }
mail-render = { path = "crates/mail-render" }
mail-smtp = { path = "crates/mail-smtp" }
ammonia = "4.1"
anyhow = "1"
base64 = "0.22"
# Parseur/générateur iCalendar (invitations, PLAN-INVITATIONS D1) — sans les
# features par défaut : elles tirent jmap-tools/serde/uuid, inutiles ici.
calcard = { version = "0.3.11", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# default-features off: the crate's default pulls native-tls for its
# convenience connectors, which mail-imap never uses (streams built by
# hand for the timeouts — P0, PLAN-SYNCHRO).
imap = { version = "3.0.0-alpha.14", default-features = false }
imap-proto = "0.16"
keyring = { version = "3", features = ["windows-native"] }
# `rustls` + `rustls-platform-verifier` (not `rustls-tls`): the Default
# certificate store then routes through the platform verifier — the ONE
# TLS stack rule (ADR 0032). `rustls-tls` would pin webpki roots instead.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls", "ring", "rustls-platform-verifier", "builder"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest-blocking", "rustls-tls"] }
# ONE TLS stack for IMAP, SMTP and OAuth (ADR 0032): rustls with the
# platform verifier — the Windows certificate store decides, corporate
# CAs included, exactly as the updater already does. `ring` as the SOLE
# crypto provider: a second provider (aws-lc-rs, rustls's default) makes
# rustls's auto-selection panic at the first handshake — measured at the
# E1 spike (spikes/tls-stack).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
webbrowser = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
