[workspace]
resolver = "2"
members = [
    "crates/mail-core",
    "crates/mail-imap",
    "crates/mail-auth",
    "crates/mail-ical",
    "crates/mail-render",
    "crates/mail-smtp",
    "apps/desktop",
    "spikes/web-bridge",
]

[workspace.package]
# La version produit (celle de tauri.conf.json) — bumpee par
# scripts/faire-release.ps1 a chaque release (PLAN-RETOURS-12 R4, D3) :
# les crates internes disent la version de l'app qui les embarque.
version = "0.12.0"
edition = "2024"

[workspace.dependencies]
mail-auth = { path = "crates/mail-auth" }
mail-core = { path = "crates/mail-core" }
mail-ical = { path = "crates/mail-ical" }
mail-imap = { path = "crates/mail-imap" }
mail-render = { path = "crates/mail-render" }
mail-smtp = { path = "crates/mail-smtp" }
ammonia = "4.1"
anyhow = "1"
base64 = "0.22"
# Parseur/générateur iCalendar (invitations, PLAN-INVITATIONS D1) — sans les
# features par défaut : elles tirent jmap-tools/serde/uuid, inutiles ici.
calcard = { version = "0.3.11", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
imap = "3.0.0-alpha.14"
imap-proto = "0.16"
keyring = { version = "3", features = ["windows-native"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
# Le backend TLS que `imap` embarque déjà (feature par défaut) : exposé en
# dépendance directe pour poser les timeouts socket AVANT la poignée de
# main (P0, PLAN-SYNCHRO) — le ClientBuilder de la crate ne borne rien.
native-tls = "0.2"
oauth2 = { version = "5", default-features = false, features = ["reqwest-blocking", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
webbrowser = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
